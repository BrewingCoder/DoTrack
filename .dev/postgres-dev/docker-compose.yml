name: dotrack-pg-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: dotrack-pg-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: dotrack
      POSTGRES_PASSWORD: dotrack
      POSTGRES_DB: dotrack_dev
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dotrack", "-d", "dotrack_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
